include:
  - path: ./jenkins-local/docker-compose.yml
    env_file: ./jenkins-local/.env

services:
  postgres:
    image: paradedb/paradedb:pg17
    container_name: idolglow-postgres
    restart: unless-stopped
    command: postgres -c shared_preload_libraries=pg_search,pg_cron
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: idolglow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD:?infra/.env에 DB_PASSWORD를 설정하세요}"
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d idolglow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres-ext-init:
    image: postgres:17-alpine
    container_name: idolglow-postgres-ext-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: "${DB_PASSWORD:?infra/.env에 DB_PASSWORD를 설정하세요}"
    entrypoint: >
      /bin/sh -c "
      psql -h postgres -U postgres -d idolglow -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;' &&
      psql -h postgres -U postgres -d idolglow -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_search;' &&
      psql -h postgres -U postgres -d idolglow -c \"SELECT extname, extversion FROM pg_extension WHERE extname IN ('vector','pg_search') ORDER BY extname;\" &&
      touch /tmp/ready &&
      exec sleep infinity
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mysql:
    image: mysql:8.4
    container_name: idolglow-mysql
    restart: unless-stopped
    profiles: ["mysql"]
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: idolglow
      MYSQL_USER: idolglow
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?infra/.env에 MYSQL_PASSWORD를 설정하세요}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?infra/.env에 MYSQL_ROOT_PASSWORD를 설정하세요}"
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  kafka:
    image: apache/kafka:3.9.1
    container_name: idolglow-kafka
    restart: unless-stopped
    profiles: ["kafka"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      TZ: Asia/Seoul
    volumes:
      - kafka_data:/var/lib/kafka/data

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: idolglow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?infra/.env에 MINIO_ROOT_USER를 설정하세요}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?infra/.env에 MINIO_ROOT_PASSWORD를 설정하세요}"
      TZ: Asia/Seoul
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio-init:
    image: pgsty/mc:latest
    container_name: idolglow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/idolglow &&
      mc anonymous set download local/idolglow &&
      mc mb --ignore-existing local/langfuse &&
      touch /tmp/ready &&
      exec sleep infinity
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: idolglow-backend
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "9090:9090"
    environment:
      TZ: Asia/Seoul
      SERVER_PORT: 9090
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,select}
      JASYPT_ENCRYPTOR_PASSWORD: "${JASYPT_ENCRYPTOR_PASSWORD:?infra/.env에 JASYPT_ENCRYPTOR_PASSWORD를 설정하세요}"
      DB_URL: jdbc:postgresql://postgres:5432/idolglow
      DB_USERNAME: postgres
      DB_PASSWORD: "${DB_PASSWORD:?infra/.env에 DB_PASSWORD를 설정하세요}"
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      MINIO_BUCKET: idolglow
      MINIO_PUBLIC_BASE_URL: http://localhost:9000/idolglow
      MINIO_PUBLIC_READ_PROFILE_OBJECTS: "true"
      MINIO_PUBLIC_READ_IDOLGLOW_OBJECTS: "true"
      APP_PUBLIC_BASE_URL: http://localhost:9090
      APP_VERSION: ${APP_VERSION:-unknown}
      MOCK_PAYMENT_WEBHOOK_SECRET: "${MOCK_PAYMENT_WEBHOOK_SECRET:?infra/.env에 MOCK_PAYMENT_WEBHOOK_SECRET를 설정하세요}"
      TOSS_BILLING_CRYPTO_SECRET: "${TOSS_BILLING_CRYPTO_SECRET:?infra/.env에 TOSS_BILLING_CRYPTO_SECRET를 설정하세요}"
      RECOMMENDATION_MAIL_UNSUBSCRIBE_SECRET: "${RECOMMENDATION_MAIL_UNSUBSCRIBE_SECRET:?infra/.env에 RECOMMENDATION_MAIL_UNSUBSCRIBE_SECRET를 설정하세요}"
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:-http://localhost:3000}
      TOSS_BILLING_SCHEDULER_ENABLED: ${TOSS_BILLING_SCHEDULER_ENABLED:-true}
      TOSS_BILLING_AMOUNT: ${TOSS_BILLING_AMOUNT:-4900}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      TOSS_BILLING_ORDER_NAME: ${TOSS_BILLING_ORDER_NAME:-IdolGlow 월간 구독}
      PAYMENT_ADMIN_ALERT_DISCORD_WEBHOOK_URL: ${PAYMENT_ADMIN_ALERT_DISCORD_WEBHOOK_URL:-}
      PAYMENT_ADMIN_ALERT_TELEGRAM_BOT_TOKEN: ${PAYMENT_ADMIN_ALERT_TELEGRAM_BOT_TOKEN:-}
      PAYMENT_ADMIN_ALERT_TELEGRAM_CHAT_ID: ${PAYMENT_ADMIN_ALERT_TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-ext-init:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9090/health/check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile
      target: ${FRONTEND_TARGET:-next}
      args:
        FRONTEND_DIR: ${FRONTEND_DIR:-frontend}
    container_name: idolglow-frontend
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  langfuse-db-init:
    image: postgres:17-alpine
    container_name: idolglow-langfuse-db-init
    profiles: ["langfuse"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: "${DB_PASSWORD}"
    entrypoint: >
      /bin/sh -c "
      psql -h postgres -U postgres -d idolglow -tAc \"SELECT 1 FROM pg_database WHERE datname = 'langfuse'\" | grep -q 1 ||
      psql -h postgres -U postgres -d idolglow -v ON_ERROR_STOP=1 -c 'CREATE DATABASE langfuse;'
      "
    restart: "no"

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: idolglow-langfuse-clickhouse
    restart: unless-stopped
    profiles: ["langfuse"]
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD}"
      TZ: Asia/Seoul
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  langfuse-redis:
    image: redis:7.4-alpine
    container_name: idolglow-langfuse-redis
    restart: unless-stopped
    profiles: ["langfuse"]
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: idolglow-langfuse-worker
    restart: unless-stopped
    profiles: ["langfuse"]
    environment: &langfuse-env
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD}@postgres:5432/langfuse"
      SALT: "${LANGFUSE_SALT}"
      ENCRYPTION_KEY: "${LANGFUSE_ENCRYPTION_KEY}"
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD}"
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: "${LANGFUSE_REDIS_PASSWORD}"
      TZ: Asia/Seoul
    depends_on: &langfuse-deps
      postgres:
        condition: service_healthy
      langfuse-db-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy

  langfuse-web:
    image: langfuse/langfuse:3
    container_name: idolglow-langfuse-web
    restart: unless-stopped
    profiles: ["langfuse"]
    ports:
      - "3100:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET}"
      LANGFUSE_INIT_ORG_ID: idolglow
      LANGFUSE_INIT_ORG_NAME: IdolGlow
      LANGFUSE_INIT_PROJECT_ID: idolglow-local
      LANGFUSE_INIT_PROJECT_NAME: IdolGlow Local
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY}"
      LANGFUSE_INIT_PROJECT_SECRET_KEY: "${LANGFUSE_SECRET_KEY}"
      LANGFUSE_INIT_USER_EMAIL: "${LANGFUSE_ADMIN_EMAIL}"
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: "${LANGFUSE_ADMIN_PASSWORD}"
    depends_on: *langfuse-deps

volumes:
  postgres_data:
  mysql_data:
  kafka_data:
  minio_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
