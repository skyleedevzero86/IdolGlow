apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: idolglow
  region: <AWS_REGION>
  version: "1.31"

iam:
  withOIDC: true

managedNodeGroups:
  - name: idolglow-ng
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 2
    volumeSize: 20
    spot: true
    labels:
      app: idolglow

accessConfig:
  authenticationMode: API_AND_CONFIG_MAP
