apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: idolglow

resources:
  - namespace.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: idolglow
    includeSelectors: false

images:
  - name: idolglow-backend
    newTag: latest
  - name: idolglow-frontend
    newTag: latest
