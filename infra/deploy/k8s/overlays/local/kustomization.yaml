apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Service
      name: idolglow-backend
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: replace
        path: /spec/ports/0/port
        value: 18080
  - target:
      kind: Service
      name: idolglow-frontend
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: replace
        path: /spec/ports/0/port
        value: 18081
  - target:
      kind: Deployment
      name: idolglow-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "local,select"
