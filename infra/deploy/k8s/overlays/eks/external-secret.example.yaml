apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: idolglow-backend-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: idolglow-backend-config
    creationPolicy: Owner
  data:
    - secretKey: application.yml
      remoteRef:
        key: idolglow/prod/backend-config
        property: application.yml
    - secretKey: application-prod.yml
      remoteRef:
        key: idolglow/prod/backend-config
        property: application-prod.yml
    - secretKey: application-select.yml
      remoteRef:
        key: idolglow/prod/backend-config
        property: application-select.yml
