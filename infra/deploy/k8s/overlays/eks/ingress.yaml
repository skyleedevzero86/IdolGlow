apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: idolglow
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - host: <APP_HOST>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: idolglow-frontend
                port:
                  number: 80
    - host: <API_HOST>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: idolglow-backend
                port:
                  number: 8080
